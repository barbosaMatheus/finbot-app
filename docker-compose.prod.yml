# Production seam / override skeleton.
#
# This file is intentionally NOT part of the default dev flow. It selects the
# "prod" build targets, drops the source bind mounts (so the image is
# self-contained and immutable), and tightens restart policies.
#
# Usage (illustrative):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Before using in a real deployment you will still want to:
#   - manage secrets outside of a committed .env (e.g. a secrets manager)
#   - front the API/web with a reverse proxy + TLS
#   - point DATABASE_URL at a managed Postgres (or keep the db service with a
#     hardened config + backups)
services:
  db:
    restart: always
    ports: []

  api:
    build:
      context: ./finbot-api
      target: prod
    restart: always
    environment:
      NODE_ENV: production
    # No source bind mounts in prod: the built image is the source of truth.
    # A plain `[]` does NOT drop inherited list entries under compose merge
    # semantics — it must be the !reset tag.
    volumes: !reset []
    command: ["node", "dist/server.js"]

  # Without this block a prod deploy inherits the dev worker wholesale:
  # target "dev", `npm run worker` under tsx watch, NODE_ENV=development,
  # and source bind mounts — or no pipeline at all. The worker owns every
  # Plaid sync and analysis job, so it gets the same prod treatment as api.
  worker:
    build:
      context: ./finbot-api
      target: prod
    restart: always
    environment:
      NODE_ENV: production
    volumes: !reset []
    command: ["node", "dist/worker.js"]
    # pg-boss gets a 30s graceful stop (src/jobs/boss.ts); Docker's default
    # 10s grace would SIGKILL mid-drain on every deploy.
    stop_grace_period: 40s

  web:
    build:
      context: ./finbot
      target: prod
    restart: always
    volumes: !reset []
    # The prod target exports a static web bundle served by a lightweight
    # static file server. See finbot/Dockerfile "prod" stage.

  # Still opt-in here: `--profile llm`. Without this block the dev port publish
  # and model pull would be inherited into a production deploy.
  ollama:
    restart: always
    ports: []
